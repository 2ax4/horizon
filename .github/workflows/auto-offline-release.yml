name: auto-offline-release
on:
  schedule:
    - cron: '37 */4 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-offline-release
  cancel-in-progress: false

jobs:
  sync:
    name: upstream kontrol
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upstream'in en son launcher surumunu bul
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          up_tag=$(gh api 'repos/horizon-rust/horizon/releases?per_page=100' \
            --jq '[.[] | select(.draft == false) | select(.tag_name | test("^launcher[@-]v?[0-9]"))][0].tag_name // empty')
          if [ -z "$up_tag" ]; then
            echo "::error::Upstream'te launcher release bulunamadi"
            exit 1
          fi
          echo "upstream launcher release: $up_tag"
          case "$up_tag" in
            launcher@*) up_version="${up_tag#launcher@}" ;;
            launcher-v*) up_version="${up_tag#launcher-v}" ;;
            *)
              echo "::error::Bilinmeyen launcher tag formati: $up_tag"
              exit 1
              ;;
          esac
          up_sha=$(gh api "repos/horizon-rust/horizon/commits/${up_tag}" --jq .sha)
          echo "upstream launcher surumu: $up_version ($up_sha)"
          {
            echo "tag=$up_tag"
            echo "version=$up_version"
            echo "sha=$up_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Yeni offline surum gerekli mi
        id: decide
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          target="launcher-v${UPSTREAM_VERSION}-offline"
          if git rev-parse -q --verify "refs/tags/${target}" >/dev/null 2>&1; then
            echo "zaten var: ${target} - yeni build gerekmiyor"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "yeni surum: ${target}"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=${target}" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch'leri uygula, tag'le ve yayinla
        if: steps.decide.outputs.should_build == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          TARGET_TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "2ax4"
          git config user.email "2ax4@users.noreply.github.com"
          git remote add upstream https://github.com/horizon-rust/horizon.git
          git fetch --filter=blob:none upstream "refs/tags/${UPSTREAM_TAG}" --no-tags
          mkdir -p /tmp/patches
          cp offline/patches/*.patch /tmp/patches/
          git checkout -B offline-auto "$UPSTREAM_SHA"
          for p in /tmp/patches/*.patch; do
            echo "::group::git am $(basename "$p")"
            git am --3way "$p" || {
              echo "::error::Patch uygulanamadi: $p (upstream ilgili dosyalari degistirmis)"
              git am --show-current-patch=diff || true
              git am --abort || true
              exit 1
            }
            echo "::endgroup::"
          done
          rm -rf .github/workflows
          mkdir -p .github/workflows
          git show origin/main:.github/workflows/launcher-release.yml > .github/workflows/launcher-release.yml
          git show origin/main:.github/workflows/auto-offline-release.yml > .github/workflows/auto-offline-release.yml
          git checkout origin/main -- offline/patches
          git add -A .github/workflows offline
          git commit -m "CI: offline release pipeline"
          git tag "$TARGET_TAG"
          git push --force-with-lease=refs/heads/main origin HEAD:main \
            || echo "::warning::main push edilemedi, tag yine de yayinlandi"
          git push origin "refs/tags/${TARGET_TAG}"

  build:
    name: offline build
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    uses: ./.github/workflows/launcher-release.yml
    with:
      ref: ${{ needs.sync.outputs.tag }}
